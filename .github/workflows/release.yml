name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build site
        run: npm run build
      
      - name: Package release artifacts
        run: |
          mkdir -p release
          find dist/resume -type f \( -name "*.pdf" -o -name "*.html" -o -name "*.md" \) -exec cp -v {} release/ \; 2>/dev/null || true
          cd dist && zip -r ../release/site-${{ github.ref_name }}.zip . && cd ..
          
          echo "Release artifacts:"
          ls -lh release/
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: false