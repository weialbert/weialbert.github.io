name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ci:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build site
        run: npm run build
      
      - name: Package release artifacts
        run: |
          mkdir -p release
          
          # Copy resume PDFs if they exist
          if [ -d "dist/resume" ]; then
            find dist/resume -type f \( -name "*.pdf" -o -name "*.typ" \) -exec cp -v {} release/ \;
          fi
          
          # Create site archive
          cd dist && zip -r ../release/site-${{ github.ref_name }}.zip . && cd ..
          
          echo "### Release artifacts:" >> $GITHUB_STEP_SUMMARY
          ls -lh release/ >> $GITHUB_STEP_SUMMARY
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: false
          body: |
            ## 🚀 Release ${{ github.ref_name }}
            
            This release includes:
            - 📦 Complete site archive
            - 📄 Resume PDFs (if available)
            
            **Deployed to:** https://weialbert.github.io